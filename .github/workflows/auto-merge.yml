name: Auto merge validated pull requests

on:
  workflow_run:
    workflows:
      - Validate
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: Enable auto merge
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Enable squash auto merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER}" ]; then
            echo "No pull request was associated with this workflow run."
            exit 0
          fi

          base_branch="$(gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --json baseRefName --jq '.baseRefName')"
          if [ "${base_branch}" != "master" ]; then
            echo "Auto merge is restricted to the current repository base branch: master."
            exit 0
          fi

          gh pr merge "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --auto \
            --squash \
            --delete-branch
